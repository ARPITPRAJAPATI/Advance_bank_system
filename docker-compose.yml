services:
  backend:
    build:
      context: ./backend
    container_name: kubepay-backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: kubepay-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped   